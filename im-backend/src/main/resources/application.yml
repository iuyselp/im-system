server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: im-system
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/im_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: ImHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  
  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.im.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false

# JWT 配置
jwt:
  secret: im-system-secret-key-2026-must-be-long-enough-for-security-requirements
  expiration: 604800000  # 7 天
  refresh-expiration: 2592000000  # 30 天
  header: Authorization
  prefix: Bearer 

# MinIO 配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: im-files
  bucket-policy: public

# WebSocket 配置
websocket:
  enabled: true
  path: /ws
  heartbeat-interval: 30000
  max-message-size: 10485760  # 10MB

# 文件上传配置
spring.servlet:
  multipart:
    max-file-size: 100MB
    max-request-size: 100MB

# 日志配置
logging:
  level:
    root: INFO
    com.im: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/im-system.log
    max-size: 100MB
    max-history: 30

# Swagger 配置
swagger:
  enabled: true
  title: IM Communication System API
  description: IM 通信系统接口文档
  version: 1.0.0
  contact:
    name: IM Team
    email: im@example.com
